backend:
  name: github
  repo: codyrobertson/vibephx-site
  branch: resources

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: blog
    label: Blog Posts
    folder: content/blog
    create: true
    slug: '{{slug}}'
    extension: mdx
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - { label: Description, name: description, widget: text }
      - { label: Author, name: author, widget: string }
      - { label: Tags, name: tags, widget: list }
      - { label: Featured Image, name: image, widget: image, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: resources
    label: Learning Resources
    folder: content/resources
    create: true
    slug: '{{slug}}'
    extension: mdx
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime }
      - { label: Description, name: description, widget: text }
      - { label: Author, name: author, widget: string }
      - { label: Tags, name: tags, widget: list }
      - { label: Featured Image, name: image, widget: image, required: false }
      - { label: Body, name: body, widget: markdown }

  - name: drafts
    label: 📝 AI-Generated Drafts
    label_singular: Draft
    folder: content/drafts
    create: false
    slug: '{{slug}}'
    extension: mdx
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Technology, name: technology, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Tags, name: tags, widget: list }
      - { label: Complexity, name: complexity, widget: select, options: ['beginner', 'intermediate', 'advanced'] }
      - { label: Featured Image, name: image, widget: image, required: false }
      - { label: Body, name: body, widget: markdown }
      - { label: Confidence Score, name: confidence, widget: number, min: 0, max: 1, step: 0.01, required: false }
      - { label: Word Count, name: wordCount, widget: number, required: false }
      - { label: External Links, name: externalLinks, widget: number, required: false }
