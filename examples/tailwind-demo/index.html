<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tailwind Tokens Demo</title>
    <link rel="stylesheet" href="./dist/output.css" />
    <style> body { font-family: ui-sans-serif, system-ui, sans-serif; } .swatch { width: 80px; height: 40px; border-radius: 8px; border: 1px solid #e5e7eb; } </style>
  </head>
  <body class="p-6">
    <h1 class="text-2xl font-bold mb-4">Tailwind + Tokens Demo</h1>
    <p class="text-sm text-gray-500 mb-6">Colors below render using rgb(var(--color.*)) from tokens.css</p>
    <div class="grid grid-cols-2 gap-4 items-center">
      <div class="swatch" style="background: rgb(var(--color-primary))"></div>
      <div>--color-primary</div>
      <div class="swatch" style="background: rgb(var(--color-secondary))"></div>
      <div>--color-secondary</div>
    </div>
  </body>
</html>
